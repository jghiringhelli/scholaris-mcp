id: no-direct-db-in-routes
title: No direct database calls in route handlers
description: >-
  Route handlers do not import or call database clients (Prisma, Sequelize,
  TypeORM, mongoose, raw SQL) directly. All database operations are delegated to
  a service or repository layer. Route handlers are driving adapters — they
  translate HTTP requests into service calls and HTTP responses. A route handler
  that calls the database directly has violated the layer boundary, making the
  database dependency invisible to the stateless reader reading only the route
  file. The Bounded property requires that each module's responsibilities and
  dependencies are derivable from its contents alone.
category: Bounded
gsProperty: Bounded
phase: development
hook: commit
check: >-
  ! grep -rn 'prisma\\.' src/routes/ --include='*.ts' | grep -v '//' && ! grep
  -rn 'prisma\\.' src/controllers/ --include='*.ts' | grep -v '//'
passCriterion: >-
  Route handlers do not import or call database clients (Prisma, Sequelize,
  TypeORM, mongoose, raw SQL) directly.
tags:
  - NODE
  - TYPESCRIPT
  - JAVASCRIPT
  - API
  - EXPRESS
  - FASTIFY
status: approved
