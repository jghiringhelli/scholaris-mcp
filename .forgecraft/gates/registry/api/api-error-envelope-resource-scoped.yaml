id: api-error-envelope-resource-scoped
title: Resource-scoped error envelope
description: >-
  API validation errors must be returned under a key that names the failing
  resource, not a generic "body" key. The envelope shape must be { "errors": {
  "<resource>": ["message"] } } where <resource> is the noun being validated
  (e.g. "username", "email", "article", "title"). A generic errors.body[]
  response makes error attribution ambiguous for clients and fails OpenAPI
  contract tests. This gate is derived from Hurl RC2: six of thirteen official
  Conduit contract tests failed solely because the implementation returned
  errors.body[] instead of resource-scoped keys. Implement a
  formatError(resource, messages) utility so the pattern is enforced uniformly
  across all endpoints.
category: Verifiable
gsProperty: Verifiable
phase: development
hook: pr
check: >-
  hurl --test --variable host=http://localhost:3000 specs/api/hurl/register.hurl
  specs/api/hurl/create-article.hurl
passCriterion: >-
  API validation errors must be returned under a key that names the failing
  resource, not a generic "body" key.
tags:
  - API
  - REST
  - NODE
  - TYPESCRIPT
  - JAVASCRIPT
status: approved
