<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholaris — Academic Paper Review</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 15px/1.65 system-ui, -apple-system, sans-serif; color: #111; background: #f4f5f7; min-height: 100vh; }

/* ── Header ── */
header {
  background: #1e3a5f;
  color: #fff;
  padding: .9rem 2rem;
  display: flex;
  align-items: baseline;
  gap: 1.25rem;
  flex-wrap: wrap;
}
.brand { font-size: 1.35rem; font-weight: 700; letter-spacing: -.5px; }
.tagline { color: #93c5fd; font-size: .85rem; }

/* ── Layout ── */
main {
  max-width: 900px;
  margin: 1.75rem auto;
  padding: 0 1rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

/* ── Card ── */
.card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 1.35rem 1.5rem;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.step-label {
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #64748b;
  margin-bottom: 1rem;
}

/* ── Tool Grid ── */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: .65rem;
}
.tool {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: .7rem .9rem;
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  transition: border-color .12s, background .12s;
}
.tool:hover { border-color: #3b82f6; }
.tool.active {
  border-color: #2563eb;
  background: #eff6ff;
}
.tool-name {
  font-size: .875rem;
  font-weight: 600;
  color: #1e293b;
  display: block;
}
.tool.active .tool-name { color: #1d4ed8; }
.tool-desc {
  font-size: .72rem;
  color: #94a3b8;
  margin-top: .2rem;
  display: block;
}

/* ── Input section ── */
.upload-row {
  display: flex;
  align-items: center;
  gap: .75rem;
  margin-bottom: .75rem;
  flex-wrap: wrap;
}
.file-btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .35rem .85rem;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  background: #f9fafb;
  cursor: pointer;
  font-size: .82rem;
  color: #374151;
  white-space: nowrap;
  transition: background .1s;
}
.file-btn:hover { background: #f3f4f6; }
.file-name { font-size: .82rem; color: #94a3b8; }
.word-count { margin-left: auto; font-size: .75rem; color: #cbd5e1; }
#paper-text {
  width: 100%;
  height: 210px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  padding: .75rem 1rem;
  font: .82rem/1.65 ui-monospace, Menlo, monospace;
  color: #1e293b;
  resize: vertical;
  transition: border-color .12s;
}
#paper-text:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }

/* ── Options ── */
.opts { display: none; }
.opts.active { display: block; }
.opts-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
.field { display: flex; flex-direction: column; gap: .3rem; min-width: 160px; }
.field label, label.field-label {
  font-size: .8rem;
  font-weight: 600;
  color: #475569;
}
.field label small { font-weight: 400; color: #94a3b8; }
select, input[type="text"] {
  padding: .38rem .7rem;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: .82rem;
  color: #1e293b;
  background: #fff;
}
select:focus, input[type="text"]:focus { outline: none; border-color: #3b82f6; }
.checks { display: flex; flex-wrap: wrap; gap: .5rem .9rem; margin-top: .15rem; }
.check-item {
  display: flex;
  align-items: center;
  gap: .35rem;
  font-size: .82rem;
  color: #374151;
  cursor: pointer;
  user-select: none;
}
.check-item input { cursor: pointer; accent-color: #2563eb; }

/* ── Companions (cross_reference_audit) ── */
.companion-item {
  border: 1px solid #e2e8f0;
  border-radius: 7px;
  padding: .85rem;
  margin-bottom: .65rem;
  background: #fafafa;
}
.companion-head {
  display: flex;
  gap: .65rem;
  align-items: center;
  margin-bottom: .6rem;
}
.companion-head input { flex: 1; }
.remove-btn {
  padding: .2rem .55rem;
  border: 1px solid #fca5a5;
  border-radius: 5px;
  background: #fff;
  color: #dc2626;
  font-size: .75rem;
  cursor: pointer;
}
.companion-text {
  width: 100%;
  height: 120px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  padding: .6rem .75rem;
  font: .78rem/1.6 ui-monospace, Menlo, monospace;
  color: #1e293b;
  resize: vertical;
  margin-bottom: .5rem;
}
.companion-text:focus { outline: none; border-color: #3b82f6; }
.add-btn {
  padding: .38rem .9rem;
  border: 1px dashed #94a3b8;
  border-radius: 6px;
  background: transparent;
  color: #64748b;
  font-size: .8rem;
  cursor: pointer;
  margin-top: .25rem;
}
.add-btn:hover { border-color: #3b82f6; color: #2563eb; background: #eff6ff; }

/* ── Diff audit textarea ── */
#da-sections {
  width: 100%;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  padding: .6rem .75rem;
  font: .82rem/1.6 ui-monospace, Menlo, monospace;
  color: #1e293b;
  resize: vertical;
}
#da-sections:focus { outline: none; border-color: #3b82f6; }

/* ── Run row ── */
.run-row {
  display: flex;
  align-items: center;
  gap: .85rem;
}
#run-btn {
  padding: .65rem 1.85rem;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: .95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s;
}
#run-btn:hover { background: #1d4ed8; }
#run-btn:disabled { background: #94a3b8; cursor: default; }
.sec-btn {
  padding: .55rem 1rem;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  background: #fff;
  color: #475569;
  font-size: .82rem;
  cursor: pointer;
}
.sec-btn:hover { background: #f1f5f9; }

/* ── Spinner ── */
.spinner {
  width: 22px; height: 22px;
  border: 3px solid #e2e8f0;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin .65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Error ── */
.error-box {
  background: #fef2f2;
  border: 1px solid #fca5a5;
  border-radius: 8px;
  padding: .85rem 1.1rem;
  color: #991b1b;
  font-size: .875rem;
}

/* ── Results ── */
.results-card { padding: 1.35rem 1.75rem; }
.results-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #f1f5f9;
  padding-bottom: .9rem;
  margin-bottom: 1.35rem;
  gap: .5rem;
  flex-wrap: wrap;
}
.results-head-btns { display: flex; gap: .5rem; }

/* Markdown output styles */
.results-body { line-height: 1.75; color: #1e293b; }
.results-body h1 { font-size: 1.35rem; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: .5rem; margin: 1.5rem 0 .75rem; }
.results-body h2 { font-size: 1.1rem; color: #1e3a5f; margin: 1.5rem 0 .6rem; }
.results-body h3 { font-size: .95rem; color: #334155; margin: 1.25rem 0 .5rem; }
.results-body h4 { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: #64748b; margin: 1.1rem 0 .4rem; }
.results-body p { margin: .5rem 0; }
.results-body ul, .results-body ol { margin: .5rem 0; padding-left: 1.5rem; }
.results-body li { margin: .3rem 0; }
.results-body strong { color: #0f172a; font-weight: 600; }
.results-body em { color: #475569; }
.results-body code {
  background: #f1f5f9;
  padding: .1rem .35rem;
  border-radius: 4px;
  font: .82em ui-monospace, Menlo, monospace;
  color: #0f172a;
}
.results-body blockquote {
  margin: .85rem 0;
  padding: .65rem 1.1rem;
  background: #fff7ed;
  border-left: 3px solid #fb923c;
  border-radius: 0 6px 6px 0;
  color: #431407;
  font-size: .875rem;
}
.results-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 1.5rem 0; }
.results-body table {
  border-collapse: collapse;
  font-size: .82rem;
  margin: 1rem 0;
  width: 100%;
  display: block;
  overflow-x: auto;
}
.results-body th {
  background: #f8fafc;
  padding: .45rem .75rem;
  border: 1px solid #cbd5e1;
  text-align: left;
  font-weight: 600;
  white-space: nowrap;
}
.results-body td { padding: .45rem .75rem; border: 1px solid #e2e8f0; }
.results-body tr:nth-child(even) td { background: #fafafa; }
</style>
</head>
<body>

<header>
  <span class="brand">Scholaris</span>
  <span class="tagline">Academic paper review — local &amp; private</span>
</header>

<main>

  <!-- 1 — Tool -->
  <div class="card">
    <div class="step-label">1 — Select Tool</div>
    <div class="tool-grid" id="tool-grid">
      <button class="tool active" data-tool="review_paper">
        <span class="tool-name">Review Paper</span>
        <span class="tool-desc">Logical · structural · rhetorical · style</span>
      </button>
      <button class="tool" data-tool="compress_draft">
        <span class="tool-name">Compress Draft</span>
        <span class="tool-desc">Saint-Exupéry redundancy audit</span>
      </button>
      <button class="tool" data-tool="check_venue_fit">
        <span class="tool-name">Venue Fit</span>
        <span class="tool-desc">Submission readiness by venue</span>
      </button>
      <button class="tool" data-tool="cross_reference_audit">
        <span class="tool-name">Cross-Reference</span>
        <span class="tool-desc">Consistency with companion docs</span>
      </button>
      <button class="tool" data-tool="diff_audit">
        <span class="tool-name">Diff Audit</span>
        <span class="tool-desc">Cascade effects after edits</span>
      </button>
      <button class="tool" data-tool="generate_rebuttal">
        <span class="tool-name">Rebuttal</span>
        <span class="tool-desc">Scaffold from reviewer comments</span>
      </button>
    </div>
  </div>

  <!-- 2 — Paper Input -->
  <div class="card" id="input-card">
    <div class="step-label" id="input-label">2 — Paper Text</div>
    <div class="upload-row">
      <label class="file-btn">
        📄 Upload file
        <input type="file" id="file-input" accept=".md,.txt,.markdown" hidden>
      </label>
      <span id="file-name" class="file-name">or paste below</span>
      <span id="word-count" class="word-count"></span>
    </div>
    <textarea id="paper-text" placeholder="Paste your paper text here (Markdown or plain text)…"></textarea>
  </div>

  <!-- 3 — Options -->
  <div class="card">
    <div class="step-label">3 — Options</div>

    <!-- review_paper -->
    <div class="opts active" id="opts-review_paper">
      <div class="opts-row">
        <div class="field">
          <label for="rp-venue">Venue</label>
          <select id="rp-venue">
            <option value="general">General</option>
            <option value="arxiv">arXiv</option>
            <option value="ieee">IEEE</option>
            <option value="acm">ACM</option>
            <option value="nature">Nature</option>
            <option value="neurips">NeurIPS</option>
            <option value="icml">ICML</option>
          </select>
        </div>
        <div class="field">
          <label for="rp-format">Report Format</label>
          <select id="rp-format">
            <option value="actionable">Actionable (default)</option>
            <option value="full">Full</option>
            <option value="summary">Summary</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:.85rem">
        <label class="field-label">Review Profiles</label>
        <div class="checks" style="margin-top:.35rem">
          <label class="check-item"><input type="checkbox" class="rp-profile" value="logical" checked> Logical</label>
          <label class="check-item"><input type="checkbox" class="rp-profile" value="rhetorical" checked> Rhetorical</label>
          <label class="check-item"><input type="checkbox" class="rp-profile" value="structural" checked> Structural</label>
          <label class="check-item"><input type="checkbox" class="rp-profile" value="style"> Style</label>
        </div>
      </div>
      <div class="opts-row">
        <div class="field" style="flex:1;min-width:200px">
          <label for="rp-section-focus">Section Focus <small>(optional)</small></label>
          <input type="text" id="rp-section-focus" placeholder="e.g. Introduction">
        </div>
        <div class="field" style="flex:2;min-width:200px">
          <label for="rp-focus-areas">Focus Areas <small>(optional, comma-separated)</small></label>
          <input type="text" id="rp-focus-areas" placeholder="e.g. citation density, proof in §3">
        </div>
      </div>
    </div>

    <!-- compress_draft -->
    <div class="opts" id="opts-compress_draft">
      <div class="field">
        <label class="field-label">Compression Mode</label>
        <div class="checks" style="margin-top:.35rem;flex-direction:column;gap:.4rem">
          <label class="check-item"><input type="radio" name="cd-mode" value="light"> <strong>Light</strong> — obvious redundancies only</label>
          <label class="check-item"><input type="radio" name="cd-mode" value="moderate" checked> <strong>Moderate</strong> — default</label>
          <label class="check-item"><input type="radio" name="cd-mode" value="aggressive"> <strong>Aggressive</strong> — flag more; suits final-draft stage</label>
        </div>
      </div>
    </div>

    <!-- check_venue_fit -->
    <div class="opts" id="opts-check_venue_fit">
      <div class="field" style="margin-bottom:.85rem">
        <label class="field-label">Venues <small style="font-weight:400;color:#94a3b8">(unchecked = all free venues)</small></label>
        <div class="checks" style="margin-top:.35rem">
          <label class="check-item"><input type="checkbox" class="vf-venue" value="arxiv" checked> arXiv</label>
          <label class="check-item"><input type="checkbox" class="vf-venue" value="acm" checked> ACM</label>
          <label class="check-item"><input type="checkbox" class="vf-venue" value="ieee" checked> IEEE</label>
          <label class="check-item"><input type="checkbox" class="vf-venue" value="nature"> Nature</label>
          <label class="check-item"><input type="checkbox" class="vf-venue" value="neurips"> NeurIPS</label>
          <label class="check-item"><input type="checkbox" class="vf-venue" value="icml"> ICML</label>
        </div>
      </div>
      <label class="check-item"><input type="checkbox" id="vf-show-gaps" checked> Show gap analysis</label>
    </div>

    <!-- cross_reference_audit -->
    <div class="opts" id="opts-cross_reference_audit">
      <div class="opts-row" style="margin-bottom:.85rem">
        <div class="field" style="flex:1;min-width:200px">
          <label for="cr-section-focus">Section Focus <small>(optional)</small></label>
          <input type="text" id="cr-section-focus" placeholder="e.g. §4 Methodology">
        </div>
        <div class="field" style="justify-content:flex-end">
          <label class="check-item" style="margin-top:1.4rem"><input type="checkbox" id="cr-show-coverage" checked> Show coverage suggestions</label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" style="margin-bottom:.5rem">Companion Documents <small style="font-weight:400;color:#94a3b8">(min 100 chars each)</small></label>
        <div id="companions-container"></div>
        <button type="button" id="add-companion" class="add-btn">+ Add Companion Document</button>
      </div>
    </div>

    <!-- diff_audit -->
    <div class="opts" id="opts-diff_audit">
      <div class="field" style="margin-bottom:.85rem">
        <label for="da-sections">Changed Section Titles <small>(one per line)</small></label>
        <textarea id="da-sections" rows="4" placeholder="Introduction&#10;Methodology&#10;Related Work"></textarea>
      </div>
      <label class="check-item"><input type="checkbox" id="da-show-claims"> Show affected claims</label>
    </div>

    <!-- generate_rebuttal -->
    <div class="opts" id="opts-generate_rebuttal">
      <div class="opts-row">
        <div class="field" style="flex:2;min-width:200px">
          <label for="gr-paper-title">Paper Title <small>(optional)</small></label>
          <input type="text" id="gr-paper-title" placeholder="e.g. Generative Specification White Paper">
        </div>
        <div class="field" style="flex:1;min-width:140px">
          <label for="gr-venue">Venue <small>(optional)</small></label>
          <input type="text" id="gr-venue" placeholder="e.g. NeurIPS 2026">
        </div>
        <div class="field">
          <label for="gr-tone">Tone</label>
          <select id="gr-tone">
            <option value="collegial">Collegial (default)</option>
            <option value="formal">Formal</option>
            <option value="concise">Concise</option>
          </select>
        </div>
      </div>
    </div>

  </div>

  <!-- Run -->
  <div class="run-row">
    <button id="run-btn">Run Analysis</button>
    <div id="spinner" class="spinner" style="display:none"></div>
    <button id="clear-btn" class="sec-btn">Clear</button>
  </div>

  <div id="error-box" class="error-box" style="display:none"></div>

  <!-- Results -->
  <div class="card results-card" id="results-section" style="display:none">
    <div class="results-head">
      <div class="step-label" style="margin-bottom:0">Results</div>
      <div class="results-head-btns">
        <button id="copy-btn" class="sec-btn">Copy Markdown</button>
        <button id="download-btn" class="sec-btn">Download .md</button>
      </div>
    </div>
    <div id="results-body" class="results-body"></div>
  </div>

</main>

<script>
"use strict";

// ── State ──────────────────────────────────────────────────────────────────
let currentTool = "review_paper";
let lastMarkdown = "";
let companions = [{ label: "", text: "" }];

// ── Tool selection ─────────────────────────────────────────────────────────
document.querySelectorAll(".tool").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tool").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentTool = btn.dataset.tool;

    document.querySelectorAll(".opts").forEach(o => o.classList.remove("active"));
    const panel = document.getElementById(`opts-${currentTool}`);
    if (panel) panel.classList.add("active");

    // For generate_rebuttal the textarea holds reviewer_comments, not paper text
    const inputLabel = document.getElementById("input-label");
    const textarea = document.getElementById("paper-text");
    if (currentTool === "generate_rebuttal") {
      inputLabel.textContent = "2 — Reviewer Comments";
      textarea.placeholder = "Paste the reviewer comments here…";
    } else {
      inputLabel.textContent = "2 — Paper Text";
      textarea.placeholder = "Paste your paper text here (Markdown or plain text)…";
    }
  });
});

// ── File upload ────────────────────────────────────────────────────────────
document.getElementById("file-input").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById("paper-text").value = ev.target.result;
    updateWordCount();
    document.getElementById("file-name").textContent = file.name;
  };
  reader.readAsText(file);
  e.target.value = ""; // allow re-uploading same file
});

// ── Word count ─────────────────────────────────────────────────────────────
document.getElementById("paper-text").addEventListener("input", updateWordCount);
function updateWordCount() {
  const text = document.getElementById("paper-text").value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById("word-count").textContent = words > 0
    ? `${words.toLocaleString()} words` : "";
}

// ── Companions ─────────────────────────────────────────────────────────────
function renderCompanions() {
  const container = document.getElementById("companions-container");
  container.innerHTML = companions.map((c, i) => `
    <div class="companion-item">
      <div class="companion-head">
        <input type="text" class="companion-label" data-i="${i}"
          placeholder="Document name (e.g. Appendix A)"
          value="${escHtml(c.label)}" style="flex:1;padding:.35rem .7rem;border:1px solid #d1d5db;border-radius:6px;font-size:.8rem">
        ${companions.length > 1
          ? `<button class="remove-btn" data-i="${i}">Remove</button>`
          : ""}
      </div>
      <textarea class="companion-text" data-i="${i}"
        placeholder="Paste companion document text (min 100 characters)…">${escHtml(c.text)}</textarea>
      <label class="file-btn companion-upload" style="font-size:.75rem">
        📄 Upload file
        <input type="file" class="companion-file" data-i="${i}" accept=".md,.txt,.markdown" hidden>
      </label>
    </div>
  `).join("");

  // Bind events
  container.querySelectorAll(".companion-label").forEach(el => {
    el.addEventListener("input", e => { companions[+e.target.dataset.i].label = e.target.value; });
  });
  container.querySelectorAll(".companion-text").forEach(el => {
    el.addEventListener("input", e => { companions[+e.target.dataset.i].text = e.target.value; });
  });
  container.querySelectorAll(".remove-btn").forEach(el => {
    el.addEventListener("click", e => {
      companions.splice(+e.target.dataset.i, 1);
      renderCompanions();
    });
  });
  container.querySelectorAll(".companion-file").forEach(el => {
    el.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const idx = +e.target.dataset.i;
      const reader = new FileReader();
      reader.onload = ev => {
        companions[idx].text = ev.target.result;
        renderCompanions();
      };
      reader.readAsText(file);
      e.target.value = "";
    });
  });
}

document.getElementById("add-companion").addEventListener("click", () => {
  if (companions.length >= 5) return;
  companions.push({ label: "", text: "" });
  renderCompanions();
});

// ── Build request body ─────────────────────────────────────────────────────
function buildRequest() {
  const paperText = document.getElementById("paper-text").value.trim();
  const body = { action: currentTool };

  if (currentTool === "review_paper") {
    body.paper_text = paperText;
    body.venue = document.getElementById("rp-venue").value;
    body.profiles = Array.from(document.querySelectorAll(".rp-profile:checked"))
      .map(el => el.value);
    if (body.profiles.length === 0) body.profiles = ["structural"];
    body.format = document.getElementById("rp-format").value;
    const sf = document.getElementById("rp-section-focus").value.trim();
    if (sf) body.section_focus = sf;
    const fa = document.getElementById("rp-focus-areas").value.trim();
    if (fa) body.focus_areas = fa.split(",").map(s => s.trim()).filter(Boolean);
    return body;
  }

  if (currentTool === "compress_draft") {
    body.paper_text = paperText;
    body.compression_mode = document.querySelector("input[name='cd-mode']:checked")?.value ?? "moderate";
    return body;
  }

  if (currentTool === "check_venue_fit") {
    body.paper_text = paperText;
    const venues = Array.from(document.querySelectorAll(".vf-venue:checked")).map(el => el.value);
    if (venues.length > 0) body.venues = venues;
    body.show_gaps = document.getElementById("vf-show-gaps").checked;
    return body;
  }

  if (currentTool === "cross_reference_audit") {
    body.paper_text = paperText;
    body.companions = companions
      .filter(c => c.text.trim().length >= 100)
      .map(c => ({ label: c.label || "Companion", text: c.text.trim() }));
    const sf = document.getElementById("cr-section-focus").value.trim();
    if (sf) body.section_focus = sf;
    body.show_coverage = document.getElementById("cr-show-coverage").checked;
    return body;
  }

  if (currentTool === "diff_audit") {
    body.paper_text = paperText;
    const sections = document.getElementById("da-sections").value
      .split("\n").map(s => s.trim()).filter(Boolean);
    body.changed_sections = sections;
    body.show_claims = document.getElementById("da-show-claims").checked;
    return body;
  }

  if (currentTool === "generate_rebuttal") {
    body.reviewer_comments = paperText;
    const title = document.getElementById("gr-paper-title").value.trim();
    if (title) body.paper_title = title;
    const venue = document.getElementById("gr-venue").value.trim();
    if (venue) body.rebuttal_venue = venue;
    body.tone = document.getElementById("gr-tone").value;
    return body;
  }

  return body;
}

// ── Validate ───────────────────────────────────────────────────────────────
function validate(body) {
  if (currentTool === "generate_rebuttal" && !body.reviewer_comments)
    return "Please paste or upload reviewer comments.";
  if (currentTool !== "generate_rebuttal" && !body.paper_text)
    return "Please paste or upload paper text.";
  if (currentTool === "cross_reference_audit" && (!body.companions || body.companions.length === 0))
    return "Cross-Reference Audit requires at least one companion document (min 100 characters).";
  if (currentTool === "diff_audit" && (!body.changed_sections || body.changed_sections.length === 0))
    return "Diff Audit requires at least one changed section title (one per line).";
  return null;
}

// ── Run ────────────────────────────────────────────────────────────────────
document.getElementById("run-btn").addEventListener("click", async () => {
  const body = buildRequest();
  const err = validate(body);
  if (err) { showError(err); return; }

  hideError();
  setLoading(true);

  try {
    const resp = await fetch("/api/dispatch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json();

    if (data.ok) {
      const md = data.result.content.map(c => c.text).join("\n\n");
      lastMarkdown = md;
      showResults(md);
    } else {
      showError(data.error ?? "Unknown error from server.");
    }
  } catch (e) {
    showError(`Network error: ${e.message}`);
  } finally {
    setLoading(false);
  }
});

function setLoading(on) {
  document.getElementById("run-btn").disabled = on;
  document.getElementById("spinner").style.display = on ? "block" : "none";
}

function showResults(md) {
  document.getElementById("results-body").innerHTML = renderMarkdown(md);
  const sec = document.getElementById("results-section");
  sec.style.display = "block";
  sec.scrollIntoView({ behavior: "smooth", block: "start" });
}

function showError(msg) {
  const box = document.getElementById("error-box");
  box.textContent = msg;
  box.style.display = "block";
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function hideError() {
  document.getElementById("error-box").style.display = "none";
}

// ── Copy / Download ────────────────────────────────────────────────────────
document.getElementById("copy-btn").addEventListener("click", () => {
  navigator.clipboard.writeText(lastMarkdown).then(() => {
    const btn = document.getElementById("copy-btn");
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = "Copy Markdown"; }, 2000);
  });
});

document.getElementById("download-btn").addEventListener("click", () => {
  const blob = new Blob([lastMarkdown], { type: "text/markdown" });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href: url, download: `scholaris-${currentTool}.md` });
  a.click();
  URL.revokeObjectURL(url);
});

// ── Clear ──────────────────────────────────────────────────────────────────
document.getElementById("clear-btn").addEventListener("click", () => {
  document.getElementById("paper-text").value = "";
  document.getElementById("file-name").textContent = "or paste below";
  document.getElementById("word-count").textContent = "";
  document.getElementById("results-section").style.display = "none";
  hideError();
  lastMarkdown = "";
  companions = [{ label: "", text: "" }];
  renderCompanions();
});

// ── Markdown renderer ──────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function inlineMd(s) {
  // Escape HTML first, then apply inline formatting
  return escHtml(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

function renderMarkdown(text) {
  const lines = text.split("\n");
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // Empty line
    if (line.trim() === "") { i++; continue; }

    // Table — detect by | ... | separator on next line
    if (line.startsWith("|") && i + 1 < lines.length && /^\|[-:| ]+\|/.test(lines[i + 1])) {
      const splitRow = row => row.split("|").filter((_, j, a) => j > 0 && j < a.length - 1);
      const headers = splitRow(line).map(h => `<th>${inlineMd(h.trim())}</th>`).join("");
      out.push(`<table><thead><tr>${headers}</tr></thead><tbody>`);
      i += 2;
      while (i < lines.length && lines[i].startsWith("|")) {
        const cells = splitRow(lines[i]).map(c => `<td>${inlineMd(c.trim())}</td>`).join("");
        out.push(`<tr>${cells}</tr>`);
        i++;
      }
      out.push("</tbody></table>");
      continue;
    }

    // Unordered list (collect run)
    if (/^[ \t]*[-*+] /.test(line)) {
      out.push("<ul>");
      while (i < lines.length && /^[ \t]*[-*+] /.test(lines[i])) {
        const content = lines[i].replace(/^[ \t]*[-*+] /, "");
        out.push(`<li>${inlineMd(content)}</li>`);
        i++;
      }
      out.push("</ul>");
      continue;
    }

    // Ordered list
    if (/^[ \t]*\d+\. /.test(line)) {
      out.push("<ol>");
      while (i < lines.length && /^[ \t]*\d+\. /.test(lines[i])) {
        const content = lines[i].replace(/^[ \t]*\d+\. /, "");
        out.push(`<li>${inlineMd(content)}</li>`);
        i++;
      }
      out.push("</ol>");
      continue;
    }

    // Headings
    const hm = line.match(/^(#{1,6}) (.+)/);
    if (hm) {
      const lv = Math.min(hm[1].length, 4);
      out.push(`<h${lv}>${inlineMd(hm[2])}</h${lv}>`);
      i++; continue;
    }

    // Blockquote
    if (line.startsWith("> ")) {
      out.push(`<blockquote>${inlineMd(line.slice(2))}</blockquote>`);
      i++; continue;
    }

    // HR
    if (/^-{3,}$/.test(line.trim())) {
      out.push("<hr>");
      i++; continue;
    }

    // Paragraph
    out.push(`<p>${inlineMd(line)}</p>`);
    i++;
  }

  return out.join("\n");
}

// ── Init ───────────────────────────────────────────────────────────────────
renderCompanions();
</script>
